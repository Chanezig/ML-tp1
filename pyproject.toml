[project]
name = "churnlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chanez Iglouli", email = "chanezig@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
]

[project.scripts]
churnlab = "churnlab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
